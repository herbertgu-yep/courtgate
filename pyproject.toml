[project]
name = "courtgate"
version = "0.1.0"
description = "CourtGate —— 面向小型商业运动场馆的场地分时预约系统"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiomysql>=0.2.0",
  "pymysql>=1.1",
  "redis>=5.2",
  "celery>=5.4",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "httpx>=0.27",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "aiosmtplib>=3.0",
  "alembic>=1.14",
  "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-redis",
  "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["alembic/"]
