services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: courtgate
      MYSQL_USER: courtgate
      MYSQL_PASSWORD: courtgate
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=400
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment: &app_env
      COURTGATE_DATABASE_URL: mysql+aiomysql://courtgate:courtgate@mysql:3306/courtgate?charset=utf8mb4
      COURTGATE_SYNC_DATABASE_URL: mysql+pymysql://courtgate:courtgate@mysql:3306/courtgate?charset=utf8mb4
      COURTGATE_REDIS_URL: redis://redis:6379/0
      COURTGATE_JWT_SECRET: change-me-in-production
      COURTGATE_PAYMENT_SECRET: change-me-in-production
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment: *app_env
    ports: ["8000:8000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment: *app_env
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "-l", "info",
              "-Q", "cg.bookings,cg.maintenance"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  beat:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment: *app_env
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "beat", "-l", "info",
              "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  mysql_data:
  redis_data:
