<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>debug</title></head>
<body>
<pre id="log" style="white-space:pre-wrap;font-size:12px"></pre>
<script>
  const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
  window.addEventListener("error", (e) => log("ERROR: " + (e.message || e) + " @ " + (e.filename||"") + ":" + (e.lineno||"")));
  window.addEventListener("unhandledrejection", (e) => log("REJECTION: " + e.reason));
</script>
