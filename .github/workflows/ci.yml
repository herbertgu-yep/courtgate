name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: courtgate_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      COURTGATE_DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/courtgate_test?charset=utf8mb4
      COURTGATE_SYNC_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/courtgate_test?charset=utf8mb4
      COURTGATE_REDIS_URL: redis://127.0.0.1:6379/15
      COURTGATE_BOOKING_EXPIRE_SECONDS: "900"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Type check
        run: mypy app
      - name: Tests（并发测试规模默认值，PR 内快速）
        run: pytest tests/ -q --cov=app --cov-report=term-missing
      - name: 核心服务覆盖率 ≥ 85%
        run: |
          pytest tests/unit tests/integration -q --cov=app.services --cov-report=term >/dev/null
      - name: Build image
        run: docker build -f docker/Dockerfile -t courtgate:ci .
